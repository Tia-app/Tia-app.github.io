<style>#tia-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0B14;color:#cfd3ff;font-family:system-ui,sans-serif;transition:opacity .4s}#tia-splash img{width:96px;height:96px;border-radius:22px;margin-bottom:22px}#tia-splash .sp{width:34px;height:34px;border:3px solid #2a2a44;border-top-color:#8E5CFF;border-radius:50%;animation:tiaspin 1s linear infinite;margin-bottom:14px}@keyframes tiaspin{to{transform:rotate(360deg)}}</style></head>
<body><div id="tia-splash"><img src="icons/Icon-192.png" alt="Tia"><div class="sp"></div><div>در حال بارگذاری تیا…</div></div><script>window.addEventListener('flutter-first-frame',function(){var e=document.getElementById('tia-splash');if(e){e.style.opacity='0';setTimeout(function(){e.remove()},450)}});</script>
